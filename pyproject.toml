[project]
name = "llm-rag"
version = "0.1.0"
description = "Local LLM RAG project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "vectorstore",
    "qdrant-client",
    "sentence-transformers",
    "ollama",
    "polars",
    "pyyaml",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "openai>=2.48.0",
    "openai-agents>=0.18.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
